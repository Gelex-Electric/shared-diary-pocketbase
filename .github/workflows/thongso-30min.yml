name: Thong so 30 phut - backfill khoang ngay (chay tay)

# Lay lai public/ThongSo_30min/<ngay>.csv cho MOT KHOANG NGAY.
#
# Vi sao can rieng du daily-pipeline da co buoc 2b: buoc do chi lay NGAY HOM QUA.
# Thung nhieu ngay (script co ma chua noi pipeline, runner hong, doi cong thuc,
# khai lai danh muc) thi phai lay lai ca khoang. Chay tay tren may thi so chi
# nam o may do — dung cai bay da lam 40 ngay du lieu ket o mot PC toi 29/09.
#
# GHI DE AN TOAN: writeByDay gop theo (METER_NO, DATE_TIME) nen chay lai khong
# nhan doi dong. Moc API tra du ngoai [from, to] bi bo.
#
# ⚠ GIOI HAN 40 NGAY: moi lan chay deu don CA THU MUC theo moc "hom nay - 40
# ngay" (KEEP_DAYS_THONGSO), khong phai theo khoang backfill. Backfill ngay cu
# hon moc do = ghi xong bi xoa ngay trong cung lan chay. Buoc kiem duoi chan
# trung truoc khi ton mot loat loi goi API.
#
# CHI DOC PocketBase (danh muc vat tu). Khong ghi gi len PB.

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Tu ngay (YYYY-MM-DD)"
        required: true
      to:
        description: "Den ngay (YYYY-MM-DD), tinh ca ngay nay"
        required: true
      dry_run:
        description: "Chi in se ghi gi, khong ghi file, khong commit"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

# Dung chung nhom voi daily-pipeline: hai ben cung ghi public/ThongSo_30min va
# cung commit/push. Chay chong len nhau thi mot ben bi tu choi push.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Chan truoc khi goi API: sai dinh dang, dao dau, hoac vuot cua so 40 ngay.
      - name: Kiem khoang ngay
        run: |
          FROM="${{ inputs.from }}"; TO="${{ inputs.to }}"
          for d in "$FROM" "$TO"; do
            echo "$d" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
              || { echo "Ngay phai dang YYYY-MM-DD, nhan duoc: $d"; exit 1; }
          done
          if [ "$FROM" \> "$TO" ]; then echo "from ($FROM) sau to ($TO)."; exit 1; fi
          CUTOFF=$(date -d '40 days ago' +%F)
          if [ "$FROM" \< "$CUTOFF" ]; then
            echo "from=$FROM cu hon moc giu $CUTOFF (hom nay - 40 ngay)."
            echo "Nhung ngay truoc $CUTOFF se bi don ngay sau khi ghi — khong lay lai duoc."
            echo "Dat from tu $CUTOFF tro di, hoac nang KEEP_DAYS_THONGSO neu that su can giu lau hon."
            exit 1
          fi
          echo "Se lay $FROM -> $TO (moc giu: $CUTOFF)."

      # Script chi dung thu vien co san cua Node, khong can npm install.
      - name: Lay thong so 30 phut
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: |
          node scripts/fetch_thongso_30min.mjs \
            --from "${{ inputs.from }}" --to "${{ inputs.to }}" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit & push CSV
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `-A`: thu muc chi giu 40 ngay, phai ghi nhan ca file bi XOA.
          git add -A public/ThongSo_30min
          if git diff --cached --quiet; then
            echo "Khong co thay doi nao de commit."
          else
            git commit -m "chore: thong so 30 phut ${{ inputs.from }}..${{ inputs.to }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
