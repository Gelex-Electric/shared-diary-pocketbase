name: Daily Pipeline (00:00 gio VN)

on:
  schedule:
    - cron: "0 17 * * *"   # 00:00 gio VN (17:00 UTC hom truoc) -> xu ly tron ngay hom qua
  workflow_dispatch:        # chay thu cong / backfill 1 ngay
    inputs:
      target_date:
        description: "Ngay can xu ly (YYYY-MM-DD). De trong = hom qua."
        required: false
        default: ""
      user_id:
        description: "UserID dung cho GetMeterAccount / GetLineList."
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Ho_Chi_Minh
      API_USER: ${{ secrets.API_USER }}
      API_PASS: ${{ secrets.API_PASS }}
      TARGET_DATE: ${{ inputs.target_date }}
      USER_ID: ${{ inputs.user_id || '2' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      # Buoc 4 da chuyen sang Node (.mjs) — xem CLAUDE.md: script moi viet bang
      # Node de chay duoc tren ca hai may. Cac buoc con lai van la Python.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # PB_URL khong dat lam secret: ca hai script tu dung mac dinh
      # https://getc.up.railway.app/pb — dung dia chi that. Ten secret la
      # PB_ADMIN_EMAIL/PB_ADMIN_PASS (khong phai PB_EMAIL/PB_PASS), lech ten nay
      # tung lam buoc 4 do va lam buoc 1 khong gui duoc canh bao HSN suot thoi
      # gian dai ma khong ai biet.
      # 1) Danh sach cong to + HSN + LINE_ID/CODE/ROLE + canh bao (tram, HSN)
      - name: Refresh meter info (GetMeterAccount + GetLineList + GetMeter)
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
        run: python scripts/fetch_meter_info.py

      # 2) Du lieu do xa 30 phut (full ngay hom qua, ×HSN, them I pha + KVAR)
      - name: Fetch meter data (full day)
        env:
          FETCH_HOURS: "25"   # chay 1 lan/ngay -> cua so phu tron 48 moc cua hom qua
        run: python scripts/fetch_meter_data.py

      # 3) Pmax ngay
      - name: Compute daily Pmax
        run: python scripts/daily_pmax.py

      # 4) Chi so HES chi tiet 30 phut, giu 30 ngay.
      # Ban Node thay ban Python tu 16/09/2026. Khac hai cho:
      #   - danh sach cong to lay tu DANH MUC PocketBase (cong to dang treo),
      #     khong phai metterinfo.csv;
      #   - HSN lay tu dm_point.hsn, khong phai METER_NAME cua HES.
      # Script chi dung thu vien co san cua Node, khong can npm install.
      - name: Fetch HES index
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
        # --notify BAT BUOC: thieu co nay thi script van do ra chi so lui nhung
        # chi in ra log, KHONG ghi canh bao nao vao PocketBase. Man "Canh bao"
        # se trong tron suot ma nhin vao lai tuong la khong co su co nao.
        # (Phat hien 17/09/2026 khi doi chieu ngay 16.)
        run: node scripts/fetch_hes_index.mjs --notify

      # 4b) Pmax cua tung LO DUONG DAY, tinh tu chinh du lieu 30 phut buoc 4 vua
      #     ghi. Phai tinh va LUU NGAY moi dem: du lieu 30 phut chi giu 30 ngay,
      #     ma dinh that cua lo lai bat buoc phai co no (cong P theo tung moc roi
      #     moi lay max). Cong Pmax tung cong to tu pmax_daily.csv thi vong 0-25%
      #     vi cac tram dat dinh khac gio nhau.
      - name: Pmax theo lo duong day
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
        run: node scripts/pmax_line_daily.mjs

      # 5) Ton that MBA — BAT LAI 24/09/2026 sau khi doi nguon HSN sang Danh muc
      #    va viet lai loi bang Node (scripts/loss_daily.mjs).
      #
      #    Tam dung tu 16/09 vi ca chuoi lay HSN tu METER_NAME cua HES. Nay:
      #      · P, Q va san luong tu hieu chi so 30' (public/hes_30min/), HSN tu
      #        dm_point — cung nguon voi fetch_hes_index;
      #      · thong so tram, vai tro diem do tu dm_station / dm_point.
      #
      #    KHONG dung `npx tsx` o day: workflow nay khong chay `npm ci` nen chi co
      #    Node tran. Script viet bang .mjs thuan la vi the.
      #
      #    Script tu tinh LAI ca ngay hom kia: khoang 23:30->00:00 co ban doc cuoi
      #    nam o file ngay SAU, luc chay cho "hom qua" thi file hom nay chua ghi ->
      #    hut moc 23:30 ~2% san luong lan ton that. Khu trung theo (CODE, DATE).
      - name: Transformer loss (30 min + daily)
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
        run: node scripts/loss_daily.mjs

      # 6) Gop theo thang tu file ngay. Van la Python: script nay khong dung PB,
      #    chuyen sang Node la viec rieng, khong nhet vao dot nay.
      - name: Transformer loss (monthly)
        run: python scripts/monthly_transformer_loss.py

      # 7) Commit MOT LAN tat ca CSV
      - name: Commit & push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git add -A` cho thu muc hes_30min: file qua 30 ngay bi XOA, phai
          # ghi nhan ca xoa chu khong chi them.
          git add -A public/hes_30min
          git add public/metterinfo.csv public/line_info.csv public/mba_info.csv public/datametter.csv public/pmax_daily.csv public/pmax_line_daily.csv
          # Ba file ton that: BO khoi day 16/09 luc tam dung, THEM LAI 24/09.
          # Quen dong nay thi buoc 5+6 van chay, van sinh file, roi bi vut di ma
          # khong ai biet — pipeline van xanh.
          git add public/transformer_loss_30min.csv public/transformer_loss_daily.csv public/transformer_loss_monthly.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily pipeline $(date +'%Y-%m-%d %H:%M ICT')"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
