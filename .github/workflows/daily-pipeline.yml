name: Daily Pipeline (00:00 gio VN)

on:
  schedule:
    - cron: "0 17 * * *"   # 00:00 gio VN (17:00 UTC hom truoc) -> xu ly tron ngay hom qua
  workflow_dispatch:        # chay thu cong / backfill 1 ngay
    inputs:
      target_date:
        description: "Ngay can xu ly (YYYY-MM-DD). De trong = hom qua."
        required: false
        default: ""
      user_id:
        description: "UserID dung cho GetMeterAccount / GetLineList."
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Ho_Chi_Minh
      API_USER: ${{ secrets.API_USER }}
      API_PASS: ${{ secrets.API_PASS }}
      TARGET_DATE: ${{ inputs.target_date }}
      USER_ID: ${{ inputs.user_id || '2' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      # Buoc 4 da chuyen sang Node (.mjs) — xem CLAUDE.md: script moi viet bang
      # Node de chay duoc tren ca hai may. Cac buoc con lai van la Python.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # PB_URL khong dat lam secret: ca hai script tu dung mac dinh
      # https://getc.up.railway.app/pb — dung dia chi that. Ten secret la
      # PB_ADMIN_EMAIL/PB_ADMIN_PASS (khong phai PB_EMAIL/PB_PASS), lech ten nay
      # tung lam buoc 4 do va lam buoc 1 khong gui duoc canh bao HSN suot thoi
      # gian dai ma khong ai biet.
      # 1) Danh sach cong to + HSN + LINE_ID/CODE/ROLE + canh bao (tram, HSN)
      - name: Refresh meter info (GetMeterAccount + GetLineList + GetMeter)
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
        run: python scripts/fetch_meter_info.py

      # 2) Du lieu do xa 30 phut (full ngay hom qua, ×HSN, them I pha + KVAR)
      - name: Fetch meter data (full day)
        env:
          FETCH_HOURS: "25"   # chay 1 lan/ngay -> cua so phu tron 48 moc cua hom qua
        run: python scripts/fetch_meter_data.py

      # 3) Pmax ngay
      - name: Compute daily Pmax
        run: python scripts/daily_pmax.py

      # 4) Chi so HES chi tiet 30 phut, giu 30 ngay.
      # Ban Node thay ban Python tu 16/09/2026. Khac hai cho:
      #   - danh sach cong to lay tu DANH MUC PocketBase (cong to dang treo),
      #     khong phai metterinfo.csv;
      #   - HSN lay tu dm_point.hsn, khong phai METER_NAME cua HES.
      # Script chi dung thu vien co san cua Node, khong can npm install.
      - name: Fetch HES index
        env:
          PB_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_PASS: ${{ secrets.PB_ADMIN_PASS }}
        # --notify BAT BUOC: thieu co nay thi script van do ra chi so lui nhung
        # chi in ra log, KHONG ghi canh bao nao vao PocketBase. Man "Canh bao"
        # se trong tron suot ma nhin vao lai tuong la khong co su co nao.
        # (Phat hien 17/09/2026 khi doi chieu ngay 16.)
        run: node scripts/fetch_hes_index.mjs --notify

      # 5) + 6) TAM DUNG tu 16/09/2026 (user chot): ca chuoi ton that dang lay HSN
      # tu METER_NAME cua HES, khong phai dm_point.hsn cua Danh muc -> sai ca P, Q
      # lan OUTPUT. Bat lai sau khi doi nguon HSN va tinh lai lich su; xem
      # plans/2026-09-16-hes-chi-so-chieu-nhan.md va co LOSS_DISABLED trong
      # src/lib/transformerLoss.ts. Script va 3 file CSV cu GIU NGUYEN.
      #
      # - name: Transformer loss (30 min)
      #   run: python scripts/daily_transformer_loss.py
      #
      # - name: Transformer loss (monthly)
      #   run: python scripts/monthly_transformer_loss.py

      # 7) Commit MOT LAN tat ca CSV
      - name: Commit & push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ba file transformer_loss_*.csv da bo khoi day tu 16/09/2026 (buoc 5+6
          # tam dung). File cu van nam trong repo, chi khong sinh/commit them.
          # `git add -A` cho thu muc hes_30min: file qua 30 ngay bi XOA, phai
          # ghi nhan ca xoa chu khong chi them.
          git add -A public/hes_30min
          git add public/metterinfo.csv public/line_info.csv public/mba_info.csv public/datametter.csv public/pmax_daily.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily pipeline $(date +'%Y-%m-%d %H:%M ICT')"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
